AWSTemplateFormatVersion: "2010-09-09"
Description: Clientword data layer for AWS Amplify - DynamoDB table, S3 bucket (with browser-upload CORS), the role the Amplify app runs as, and an optional daily reminders schedule

Parameters:
  AppUrl:
    Type: String
    Description: Public https address people will visit (your domain, or the Amplify one like https://main.d1234.amplifyapp.com). No trailing slash. Update the stack once you know it.
    Default: "https://example.com"
  CronSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Long random string that protects the reminders endpoint (use the same value as the CRON_SECRET variable in Amplify)
  EnableReminders:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Turn on after the app is live and AppUrl is correct. Sends the daily "please finish your onboarding" job.

Conditions:
  Reminders: !Equals [!Ref EnableReminders, "true"]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }   # sessions, reset links and rate-limit counters expire by themselves
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Browsers upload straight to the bucket (PUT) and read PDFs from it to fill in and convert them (GET), from your site only
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AppUrl]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # The identity Amplify's server-side code runs as: only this table, this bucket, and sending email
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: amplify.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: clientword-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"

  # ---- daily reminders: EventBridge calls POST /api/cron/reminders with the secret header ----
  CronConnection:
    Type: AWS::Events::Connection
    Condition: Reminders
    Properties:
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters: { ApiKeyName: x-cron-secret, ApiKeyValue: !Ref CronSecret }
  CronDestination:
    Type: AWS::Events::ApiDestination
    Condition: Reminders
    Properties:
      ConnectionArn: !GetAtt CronConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "${AppUrl}/api/cron/reminders"
      InvocationRateLimitPerSecond: 1
  CronInvokeRole:
    Type: AWS::IAM::Role
    Condition: Reminders
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: events.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: events:InvokeApiDestination, Resource: !GetAtt CronDestination.Arn }
  DailyReminders:
    Type: AWS::Events::Rule
    Condition: Reminders
    Properties:
      ScheduleExpression: cron(15 9 * * ? *)   # 09:15 UTC every day
      State: ENABLED
      Targets:
        - Id: reminders
          Arn: !GetAtt CronDestination.Arn
          RoleArn: !GetAtt CronInvokeRole.Arn

Outputs:
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref Bucket
  AppRoleArn:
    Description: Paste this as the "Compute role" in Amplify (App settings > IAM roles)
    Value: !GetAtt AppRole.Arn
