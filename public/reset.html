<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset password · Clientword</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head><body>
<main style="max-width:420px;margin:12vh auto;padding:0 16px">
  <a class="brandmark" href="/" style="margin-bottom:18px"><img src="/favicon.svg" alt="" width="26" height="26"><span class="wm">Client<span>word</span></span></a>
  <form class="card stack" id="form" novalidate>
    <h1 style="font-size:1.4rem;margin:0">Choose a new password</h1>
    <div><label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password"></div>
    <button class="btn" id="go" type="submit">Save password</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script type="module" src="/reset.js"></script>
</body></html>
